    bio: "I'm Saif, a Senior Systems & Biomedical Engineering student at Cairo University focused on Deep Learning, especially self-supervised learning, world models, and uncertainty quantification and their application in medical. My work spans video processing, world models, and conformal prediction."
    bio2: "Previously, I was an AI intern at <a href=\"https://www.siemens.com/en-us/company/about/siemens-egypt/\">Siemens</a> and later an undergraduate research assistant at Cairo University with Dr. <a href=\"https://scholar.google.com/citations?user=y_8D7KEAAAAJ&hl=en\">Meena M. Makary</a>, working on lesion tracking and labeling."
    bio3: "I'm currently an undergraduate researcher at <a href=\"https://risingsh.github.io/website/\">RiSH</a> with Dr. <a href=\"https://www.jfayyad.com/\">Jamil Fayyad</a>, researching Conformal Prediction for World Models."
    bio4: "Additionally, my team and I are working on our BSc Thesis under the supervision of <b>Dr. Asem A. Abdelaziz</b> and Eng. <a href=\"https://bkhmsi.github.io/\">Badr AlKhamissi</a>. We are tackling sample efficiency and physics intuition in video world models by building a high-quality egocentric video dataset through a curation pipeline we call <i>EgoCuration</i>."
