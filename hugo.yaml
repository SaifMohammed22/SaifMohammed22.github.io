baseURL: "https://saifmohammed22.github.io/"
locale: "en-us"
title: "Saif Mohammed"
enableRobotsTXT: true
buildFuture: true
publishDir: "docs"
cleanDestinationDir: true
disableLiveReload: true

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["\\(", "\\)"]
            - ["$", "$"]

