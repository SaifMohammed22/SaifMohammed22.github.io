  description: "Deep Learning Research & Engineering"
  email: "ssaifmohammed04@gmail.com"
  author:
    name: "Saif Mohammed"
    role: "Deep Learning Research & Engineering"
    cv: "/files/cv.pdf"
    bio: "I'm Saif, a Senior Systems & Biomedical Engineering student at Cairo University focused on Deep Learning, especially computer vision, self-supervised learning, world models, and uncertainty quantification, with applications in medicine and robotics."
    bio2: "Previously, I was an AI intern at <a href=\"https://www.siemens.com/en-us/company/about/siemens-egypt/\">Siemens</a> and later an undergraduate research assistant at Cairo University with Dr. <a href=\"https://scholar.google.com/citations?user=y_8D7KEAAAAJ&hl=en\">Meena M. Makary</a>, working on lesion tracking and labeling."
    bio3: "I'm currently a researcher at <a href=\"https://risingsh.github.io/website/\">RiSH</a> with Dr. <a href=\"https://www.jfayyad.com/\">Jamil Fayyad</a>, working on Conformal Prediction for World Models. My team and I are also developing <i>EgoCuration</i>, a pipeline for curating high-quality egocentric video datasets, as our BSc thesis under Dr. Asem A. Abdelaziz and Eng. <a href=\"https://bkhmsi.github.io/\">Badr AlKhamissi</a>."
    avatar: "images/profile-photo.jpeg"
    interests:
      - "Deep Learning"
      - "World Models"
      - "Self-Supervised Learning (SSL)"
      - "AI for Science"
      - "Uncertainty Quantification"
    education:
