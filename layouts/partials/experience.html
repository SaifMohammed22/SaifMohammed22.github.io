<section id="experience" class="section-container">
  <div class="container">
    <h2 class="section-heading">Experience</h2>
    <div class="exp-list">
      {{ range .Site.Data.experience }}
      <div class="exp-item">
        {{ if .image }}
        <div class="exp-image">
          <img src="{{ .image }}" alt="{{ .company }}" loading="lazy">
        </div>
        {{ end }}
        <div class="exp-body">
          <div class="exp-header">
            <h3 class="exp-title">{{ .title }}</h3>
            <span class="exp-period">{{ .period }}</span>
          </div>
          <div class="exp-company">
            {{ if .company_url }}<a href="{{ .company_url }}" target="_blank">{{ end }}
            {{ .company }}
            {{ if .company_url }}</a>{{ end }}
          </div>
          <div class="exp-desc">{{ .body | markdownify }}</div>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
