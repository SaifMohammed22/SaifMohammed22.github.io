<section id="contact" class="section-container">
  <div class="container">
    <div class="section-header">
      <h2 class="section-heading">Contact</h2>
    </div>
    <div class="contact-content">
      <p>Feel free to reach out — I'm always open to discussing research, collaboration, or new opportunities.</p>
      <div class="contact-cta">
        <a href="mailto:{{ .Site.Params.email }}" class="contact-email-btn">
          <i class="fas fa-envelope"></i> {{ .Site.Params.email }}
        </a>
      </div>
    </div>
  </div>
</section>
